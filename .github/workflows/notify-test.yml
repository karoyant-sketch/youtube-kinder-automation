name: Notify Test

on:
  workflow_dispatch:
  push:
    branches: [ccr-83fa6068-k6d9nc]
    paths: [".github/workflows/notify-test.yml", "state/notify_msg.txt"]

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WA_TOKEN: ${{ secrets.WA_TOKEN }}
      WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
      SEVEN_API_KEY: ${{ secrets.SEVEN_API_KEY }}
      SMS_PHONE: ${{ secrets.SMS_PHONE }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests && python shorts/notify.py "$(cat state/notify_msg.txt 2>/dev/null)"
