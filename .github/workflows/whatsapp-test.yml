name: WhatsApp Test

on:
  workflow_dispatch:
  push:
    branches: [ccr-83fa6068-k6d9nc]
    paths: [".github/workflows/whatsapp-test.yml"]

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests && python shorts/notify.py
