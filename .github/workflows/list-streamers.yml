name: List GTA6 Streamers

on:
  workflow_dispatch:
  push:
    branches: [ccr-83fa6068-k6d9nc]
    paths: ["shorts/list_streamers.py", ".github/workflows/list-streamers.yml"]

permissions:
  contents: write

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TWITCH_CLIENT_ID: 2jxz7e0w48xkn6wjguxfrm9hsf28hb
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests && python shorts/list_streamers.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/streamers.json
          git commit -m "Streamer list [skip ci]"
          git pull --rebase -q && git push
